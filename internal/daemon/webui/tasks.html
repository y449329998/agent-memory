{{define "content"}}
<nav class="crumbs" aria-label="面包屑"><a href="/">总览</a><span class="sep">/</span><span>任务</span></nav>
<header class="page-head">
  <p class="kicker">TASKS</p>
  <h1 class="display-sm">任务</h1>
  <p class="lede">对话任务 = 某个 agent 里的一次对话，步骤从对话里整理出来；跨对话的收尾用合并任务。</p>
</header>
<section class="section">
  <div class="section-head">
    <h2>任务列表</h2>
    <span id="tasks-meta" class="meta"></span>
    <a class="more" href="/t/new">新建任务 <span aria-hidden="true">→</span></a>
  </div>
  <form id="task-filters" class="task-filters">
    <div class="tf-field"><span>视图</span><select id="tf-kind">
      <option value="session">对话任务</option><option value="formal">合并任务</option><option value="">全部</option>
    </select></div>
    <label class="tf-field tf-search"><span>关键词</span><input id="tf-q" type="search" placeholder="搜索目标、步骤、下一步、文件"></label>
    <div class="tf-field"><span>项目</span><select id="tf-project"><option value="">全部项目</option></select></div>
    <div class="tf-field"><span>状态</span><select id="tf-status">
      <option value="">全部状态</option><option value="doing">进行中</option>
      <option value="blocked">受阻</option><option value="done">已完成</option><option value="unknown">未知</option>
    </select></div>
    <label class="tf-field"><span>Owner</span><input id="tf-owner" type="text" placeholder="qoder / claude"></label>
    <div class="tf-field"><span>来源</span><select id="tf-source">
      <option value="">全部来源</option>
      <option value="qoder">Qoder</option><option value="trae">Trae</option>
      <option value="workbuddy">WorkBuddy</option><option value="web">手动</option><option value="mcp">MCP</option>
    </select></div>
    <div class="tf-field"><span>更新时间</span><select id="tf-range">
      <option value="">全部时间</option><option value="7">最近 7 天</option>
      <option value="30">最近 30 天</option><option value="90">最近 90 天</option>
    </select></div>
    <div class="tf-field"><span>排序</span><select id="tf-sort">
      <option value="">最近有内容</option><option value="created">最近创建</option><option value="idle">最久没动</option>
    </select></div>
    <div class="tf-actions">
      <label class="check tf-archive"><input id="tasks-archived" type="checkbox"> 显示归档</label>
      <button class="stamp small" type="submit">筛选</button>
      <button id="tf-reset" class="stamp small ghost" type="button">重置</button>
    </div>
  </form>
  <div id="task-cards" class="cards"></div>
</section>
{{end}}
